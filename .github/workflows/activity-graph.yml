name: Update Activity Graph

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download activity graph
        run: |
          curl -fsSL \
            "https://github-readme-activity-graph-1poazijah-ahanin.vercel.app/graph?username=mohAhanin&theme=github" \
            -o /tmp/activity-graph-response

          echo "=== FILE TYPE ==="
          file /tmp/activity-graph-response

          echo "=== FILE SIZE ==="
          wc -c /tmp/activity-graph-response

          echo "=== FIRST 1000 CHARACTERS ==="
          head -c 1000 /tmp/activity-graph-response
          echo

      - name: Extract SVG
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("/tmp/activity-graph-response").read_text(
              encoding="utf-8",
              errors="replace"
          )

          print("Response length:", len(source))

          match = re.search(r"<svg\b.*?</svg>", source, re.DOTALL)

          if not match:
              print("NO SVG FOUND")
              raise SystemExit(1)

          svg = match.group(0)

          print("Extracted SVG length:", len(svg))

          Path("assets/activity-graph.svg").write_text(
              svg,
              encoding="utf-8"
          )
          PY

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin libxml2-utils

      - name: Validate SVG
        run: |
          xmllint --noout assets/activity-graph.svg

      - name: Convert SVG to PNG
        run: |
          rsvg-convert \
            -w 1200 \
            assets/activity-graph.svg \
            -o assets/activity-graph.png

      - name: Check generated PNG
        run: |
          file assets/activity-graph.png
          ls -lh assets/activity-graph.png

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-graph.svg assets/activity-graph.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub activity graph"
            git push
          fi
