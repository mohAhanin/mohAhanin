name: Update Activity Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download activity graph
        run: |
          mkdir -p assets

          curl -fsSL \
            "https://github-readme-activity-graph-1poazijah-ahanin.vercel.app/graph?username=mohAhanin&theme=github" \
            -o /tmp/activity-graph-response.svg

      - name: Extract valid SVG
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("/tmp/activity-graph-response.svg").read_text(
              encoding="utf-8",
              errors="replace"
          )

          match = re.search(r"<svg\b.*?</svg>", source, re.DOTALL)

          if not match:
              print("Could not find a complete SVG document.")
              print(source[:1000])
              raise SystemExit(1)

          svg = match.group(0)

          Path("assets/activity-graph.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print(f"Extracted SVG: {len(svg)} characters")
          PY

      - name: Validate SVG
        run: |
          xmllint --noout assets/activity-graph.svg

      - name: Convert SVG to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          rsvg-convert \
            -w 1200 \
            assets/activity-graph.svg \
            -o assets/activity-graph.png

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity-graph.svg assets/activity-graph.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub activity graph"
            git push
          fi
